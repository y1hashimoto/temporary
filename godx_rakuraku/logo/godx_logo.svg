<svg xmlns="http://www.w3.org/2000/svg" width="360" height="120" viewBox="0 0 360 120" role="img" aria-label="GO DX">
  <defs>
    <linearGradient id="godxGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00b8d4"/>
      <stop offset="0.55" stop-color="#0091ea"/>
      <stop offset="1" stop-color="#3949ab"/>
    </linearGradient>
    <linearGradient id="godxArrow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#18ffb0"/>
      <stop offset="1" stop-color="#00e5ff"/>
    </linearGradient>
  </defs>

  <!-- Badge: rounded square with forward "GO" motion arrows -->
  <rect x="8" y="14" width="92" height="92" rx="20" fill="url(#godxGrad)"/>
  <!-- three chevrons = forward / GO / transformation -->
  <g fill="none" stroke="url(#godxArrow)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M34 40 L52 60 L34 80"/>
    <path d="M52 40 L70 60 L52 80" opacity="0.75"/>
    <path d="M70 40 L88 60 L70 80" opacity="0.45"/>
  </g>

  <!-- Wordmark -->
  <text x="118" y="62" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="46" font-weight="800" letter-spacing="1" fill="#1a237e">GO
    <tspan fill="url(#godxGrad)"> DX</tspan>
  </text>
  <!-- Tagline -->
  <text x="120" y="90" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="14" font-weight="600" letter-spacing="3" fill="#5c6bc0">DIGITAL TRANSFORMATION</text>
</svg>
